name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  media-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install open media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg mkvtoolnix

      - name: Record media tool versions
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          mkvmerge --version

      - name: Install HDR10+ metadata tool
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, os, pathlib, tarfile, urllib.request
          name = "hdr10plus_tool-1.7.2-x86_64-unknown-linux-musl.tar.gz"
          url = "https://github.com/quietvoid/hdr10plus_tool/releases/download/1.7.2/" + name
          archive = urllib.request.urlopen(url).read()
          checksum = urllib.request.urlopen(url + ".sha256").read().decode().split()[0]
          assert hashlib.sha256(archive).hexdigest() == checksum, "HDR10+ download checksum mismatch"
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hdr10plus-bin"
          directory.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              member = next(item for item in bundle.getmembers() if pathlib.PurePosixPath(item.name).name == "hdr10plus_tool" and item.isfile())
              target = directory / "hdr10plus_tool"
              target.write_bytes(bundle.extractfile(member).read())
              target.chmod(0o755)
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(directory) + "\n")
          PY

      - name: Record HDR10+ tool version
        run: hdr10plus_tool --version

      - name: Run hermetic media integration tests
        run: python -m pytest -m integration -v
