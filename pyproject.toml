[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "de-dolby"
version = "0.1.0"
description = "Convert Dolby Vision MKV files to HDR10"
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
de-dolby = "de_dolby.cli:main"

[tool.setuptools.packages.find]
include = ["de_dolby*", "harness*"]
exclude = ["tests*", "harness_tests*"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = ["integration: requires external open media tools"]
